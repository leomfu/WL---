# 每天早上抓一次新闻，写进 content/news/latest.json 并提交 —— Vercel 收到 push 自动重新构建。
#
# 时区：GitHub 的 cron 只认 UTC。北京时间 06:00 = 前一天的 UTC 22:00。
# ⚠️ GitHub 的定时任务在高峰期会**延迟几分钟到几十分钟**，它不是精准闹钟。
#    要卡死 6 点整，只能在自己电脑上跑（见 docs/进度.md）。
name: 每日新闻

on:
  schedule:
    - cron: "0 22 * * *"
  # 手动触发：仓库 → Actions → 每日新闻 → Run workflow
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 抓取脚本只用 Node 内置 API，没有依赖，所以不需要 npm ci
      - name: 抓取
        run: node scripts/fetch-news.mjs

      - name: 有变化就提交
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/news/latest.json
          if git diff --staged --quiet; then
            echo "今天没有新内容，不提交。"
          else
            git commit -m "每日新闻：$(date -u -d '+8 hours' '+%Y-%m-%d')"
            git push
          fi
