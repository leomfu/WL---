<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300&display=swap">
  <style>
    body { margin: 0; font-family: Inter, "PingFang SC", system-ui, sans-serif; }
    a { color: #1a1a1a; } a:hover { color: #000000; }
  </style>
</helmet>

<!-- 专注区 · 重做为「桌面」
     不再以时间为主题：没有大表盘，页面是一张写字台，
     番茄钟 / 手记 / 时刻表 是摊在上面的三份纸，用纸夹标签切换。
     底色中灰（#3d3d3d → #2c2c2c），不黑不白。 -->
<div style="position: relative; width: 1440px; height: 900px; background: #343434; overflow: hidden;">

  <!-- 桌面：左上来光，右下沉下去 -->
  <div style="position: absolute; inset: 0; background-image: linear-gradient(152deg, #414141 0%, #383838 34%, #313131 68%, #2a2a2a 100%);"></div>
  <div style="position: absolute; inset: 0; background-image: radial-gradient(58% 52% at 28% 12%, rgba(237,237,237,0.07) 0%, rgba(237,237,237,0) 64%);"></div>

  <!-- 台面的哑光颗粒 -->
  <svg viewBox="0 0 1440 900" width="1440" height="900" style="position: absolute; inset: 0; opacity: 0.055; mix-blend-mode: overlay;">
    <filter id="deskGrain"><feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" /><feColorMatrix type="saturate" values="0" /></filter>
    <rect width="1440" height="900" filter="url(#deskGrain)" />
  </svg>

  <!-- 左侧图标条：跟着调成中灰，不再是一条黑带 -->
  <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 64px; background: rgba(0,0,0,0.18); border-right: 1px solid rgba(0,0,0,0.24); display: flex; flex-direction: column; align-items: center; padding: 26px 0; gap: 22px;">
    <div style="width: 26px; height: 26px; border-radius: 999px; border: 1px solid rgba(237,237,237,0.22); display: flex; align-items: center; justify-content: center;">
      <span style="font-family: 'Noto Serif SC', serif; font-size: 9px; color: rgba(237,237,237,0.5);">WL</span>
    </div>
    <div style="width: 20px; height: 1px; background: rgba(237,237,237,0.12);"></div>
    <sc-for list="{{railIcons}}" as="i" hint-placeholder-count="6">
      <div style="width: 15px; height: 15px; border: 1px solid rgba(237,237,237,0.16); border-radius: 2px;"></div>
    </sc-for>
    <div style="margin-top: auto;">
      <span style="font-size: 9px; letter-spacing: 0.1em; color: rgba(237,237,237,0.32); border: 1px solid rgba(237,237,237,0.16); padding: 3px 5px;">ESC</span>
    </div>
  </div>

  <div style="position: absolute; top: 42px; left: 64px; right: 0; display: flex; justify-content: center;">
    <span style="font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(237,237,237,0.28);">导航已收起 · 鼠标移到左侧或按 ESC 退出</span>
  </div>

  <!-- ── 桌上的三份纸 ── -->
  <div style="position: absolute; left: 372px; top: 176px; width: 776px;">

    <!-- 后面两份只露出纸夹标签，点标签就翻到那一份 -->
    <div style="position: relative; height: 38px;">
      <div style="position: absolute; left: 0; bottom: 0; display: flex; align-items: flex-end; gap: 4px;">
        <div style="padding: 11px 30px 12px; background: #eaeaea; box-shadow: 0 -2px 6px rgba(0,0,0,0.22);">
          <span style="font-size: 13.5px; color: #1a1a1a;">番茄钟</span>
        </div>
        <div style="padding: 9px 26px 10px; background: #b9b9b9; box-shadow: 0 -2px 6px rgba(0,0,0,0.2);">
          <span style="font-size: 13px; color: #4a4a4a;">手记</span>
        </div>
        <div style="padding: 9px 26px 10px; background: #b9b9b9; box-shadow: 0 -2px 6px rgba(0,0,0,0.2);">
          <span style="font-size: 13px; color: #4a4a4a;">时刻表</span>
        </div>
      </div>
    </div>

    <!-- 当前这一份：一张摊开的稿纸 -->
    <div style="position: relative; background: #eaeaea; box-shadow: 0 26px 60px rgba(0,0,0,0.42), 0 3px 10px rgba(0,0,0,0.28); padding: 44px 56px 40px;">

      <!-- 纸上的极淡横线，像真的稿纸 -->
      <svg viewBox="0 0 776 500" width="100%" height="100%" preserveAspectRatio="none" style="position: absolute; inset: 0; opacity: 0.5;">
        <sc-for list="{{ruleLines}}" as="l" hint-placeholder-count="12">
          <line x1="56" y1="{{l.y}}" x2="720" y2="{{l.y}}" stroke="#d3d3d3" stroke-width="1" />
        </sc-for>
      </svg>

      <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 30px;">

        <div style="display: flex; align-items: baseline; justify-content: space-between; width: 100%;">
          <span style="font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: #8a8a8a;">专注 · Focus</span>
          <div style="display: flex; align-items: center; gap: 9px;">
            <div style="display: flex; gap: 6px;">
              <sc-for list="{{dots}}" as="d" hint-placeholder-count="4">
                <span style="width: 5px; height: 5px; border-radius: 999px; background: {{d.fill}};"></span>
              </sc-for>
            </div>
            <span style="font-size: 11.5px; color: #8a8a8a;">已完成 2</span>
          </div>
        </div>

        <!-- 时间就是一行大字，不再有表盘 -->
        <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
          <span style="font-family: 'Noto Serif SC', Songti SC, Georgia, serif; font-weight: 200; font-size: 128px; line-height: 1; letter-spacing: 0.005em; color: #141414; font-variant-numeric: tabular-nums;">25:00</span>
          <!-- 进度是纸上的一道细线，走完就到头 -->
          <div style="position: relative; width: 420px; height: 2px; background: #d3d3d3;">
            <div style="position: absolute; left: 0; top: 0; height: 2px; width: 286px; background: #141414;"></div>
            <div style="position: absolute; left: 286px; top: -3px; width: 8px; height: 8px; border-radius: 999px; background: #141414;"></div>
          </div>
        </div>

        <!-- 控件：全在纸中央，手不用跑 -->
        <div style="display: flex; align-items: center; gap: 20px;">
          <div style="padding: 10px 18px; border: 1px solid #cfcfcf;">
            <span style="font-size: 12.5px; color: #555555;">重置</span>
          </div>
          <div style="width: 56px; height: 56px; border-radius: 999px; background: #141414; display: flex; align-items: center; justify-content: center;">
            <svg width="14" height="16" viewBox="0 0 14 16" fill="#eaeaea"><path d="M13 8 0 16V0z" /></svg>
          </div>
          <div style="padding: 10px 18px; border: 1px solid #cfcfcf;">
            <span style="font-size: 12.5px; color: #555555;">响铃 开</span>
          </div>
        </div>

        <div style="display: flex; border: 1px solid #cfcfcf;">
          <sc-for list="{{presets}}" as="p" hint-placeholder-count="3">
            <div style="padding: 9px 26px; display: flex; align-items: baseline; gap: 8px; background: {{p.bg}}; border-right: 1px solid #dcdcdc;">
              <span style="font-size: 12.5px; color: {{p.fg}};">{{p.label}}</span>
              <span style="font-size: 11px; color: #999999; font-variant-numeric: tabular-nums;">{{p.min}}</span>
            </div>
          </sc-for>
        </div>

        <span style="font-size: 11.5px; color: #999999;">点数字可以自己改时长</span>
      </div>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const ruleLines = [];
    for (let i = 0; i < 12; i++) ruleLines.push({ y: 60 + i * 36 });

    return {
      ruleLines: ruleLines,
      railIcons: [1, 2, 3, 4, 5, 6],
      dots: [
        { fill: '#141414' }, { fill: '#141414' },
        { fill: '#cfcfcf' }, { fill: '#cfcfcf' },
      ],
      presets: [
        { label: '专注', min: '25', bg: '#dedede', fg: '#141414' },
        { label: '短休', min: '5', bg: 'transparent', fg: '#666666' },
        { label: '长休', min: '15', bg: 'transparent', fg: '#666666' },
      ],
    };
  }
}
</script>
</body>
</html>
